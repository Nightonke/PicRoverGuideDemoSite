<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>批量图片测试页 - PicRover 操作引导</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-gallery="batch">
  <header class="page-header">
    <a class="back-link" href="index.html">PicRover 操作引导</a>
    <h1>批量图片测试页</h1>
    <p>这是备用批量图片集合，可用于测试更多图片数量下的识别、选中和下载。</p>
  </header>

  <main>
    <section class="gallery-section">
      <div class="section-heading">
        <h2>主图片集合</h2>
        <p>适合测试批量识别后的默认选中、手动选择和下载数量。</p>
      </div>
      <div class="gallery-grid gallery-grid--small" data-gallery-mount></div>
    </section>

    <section class="gallery-section">
      <div class="section-heading">
        <h2>补充图片集合</h2>
        <p>适合测试同一页面内多个图片区域的扫描结果。</p>
      </div>
      <div class="gallery-grid gallery-grid--small" data-gallery-mount="batchEdges"></div>
    </section>
  </main>

  <script src="assets/demo-data.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
