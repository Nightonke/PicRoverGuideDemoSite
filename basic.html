<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <a class="back-link" href="index.html">PicRover 操作引导</a>

    <p>点击底部识别按钮，选择图片后即可下载。</p>

  <main>

      <p class="eyebrow">在 PicRover 里这样操作</p>

      <div class="section-heading">
        <h2>图片示例</h2>

      <div class="gallery-grid" data-gallery-mount></div>
    </section>

    <section class="background-row" data-background-row="landscape"></section>

    <nav class="pager">
