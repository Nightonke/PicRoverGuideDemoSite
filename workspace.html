<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>多工作区浏览 - PicRover 操作引导</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-gallery="workspace">
  <header class="page-header">
    <a class="back-link" href="index.html">PicRover 操作引导</a>
    <h1>多工作区浏览</h1>
    <p>长按链接，在新工作区打开不同页面。</p>
  </header>

  <main>
    <section class="guide-panel">
      <p class="eyebrow">在 PicRover 里这样操作</p>
      <ol class="guide-steps">
        <li><strong>长按链接</strong><span>选择在新工作区打开。</span></li>
        <li><strong>切换工作区</strong><span>在多个页面间来回切换。</span></li>
        <li><strong>分别识别</strong><span>每个工作区独立保存结果。</span></li>
      </ol>
    </section>

    <section class="link-lab">
      <a class="story-link" href="workspace-link-a.html">
        <span>工作区示例 A</span>
        <strong>长按我，在新工作区打开第一组图片</strong>
      </a>
      <a class="story-link" href="workspace-link-b.html">
        <span>工作区示例 B</span>
        <strong>长按我，在新工作区打开第二组图片</strong>
      </a>
      <a class="story-link" href="similar.html">
        <span>连续图集入口</span>
        <strong>打开排队下载相似图集的引导页</strong>
      </a>
    </section>

    <section class="gallery-section">
      <div class="section-heading">
        <h2>当前工作区图片</h2>
        <p>点击识别后，只会更新当前工作区的图片面板。</p>
      </div>
      <div class="gallery-grid gallery-grid--small" data-gallery-mount></div>
    </section>
  </main>

  <script src="assets/demo-data.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
